[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "lockguard"
version = "0.1.0"
description = "Flag malicious-looking code in npm dependency updates before you merge them."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "lockguard contributors" }]
keywords = [
  "npm",
  "supply-chain",
  "security",
  "package-lock",
  "dependabot",
  "malware",
  "github-action",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = ["rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "mypy>=1.8"]

[project.scripts]
lockguard = "lockguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lockguard"]

# The inert demo fixtures ship inside the wheel so `lockguard demo` works after
# `pipx install`. In an editable install they are read from tests/fixtures.
[tool.hatch.build.targets.wheel.force-include]
"tests/fixtures" = "lockguard/_fixtures"

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "scripts",
  "docs",
  "action.yml",
  "README.md",
  "LICENSE",
  ".lockguardrc.example.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE"]
ignore = [
  "E501",   # ruff format takes care of this
  "SIM905", # "a b c".split() is fine
  "RUF001", # the report deliberately uses typographic characters such as "→" and "-"
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["lockguard"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
warn_unreachable = true
